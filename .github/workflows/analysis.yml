name: Technical Analysis (10min)

on:
  # 交易时间每10分钟运行
  # 北京时间 9:30-11:30, 13:00-15:00
  # UTC = 北京时间 - 8
  schedule:
    # 上午盘: 01:30-03:30 UTC (9:30-11:30 北京)
    - cron: '*/10 1-3 * * 1-5'
    # 下午盘: 05:00-07:00 UTC (13:00-15:00 北京)
    - cron: '*/10 5-6 * * 1-5'
  
  # 手动触发
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install akshare pandas tenacity requests
      
      - name: Run analysis
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
        run: |
          python scripts/analyze_hot_etfs.py
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/analysis_cache.json
          git diff --quiet --cached || git commit -m "📈 Analysis update: $(date +'%H:%M') UTC"
          
          # 推送前先拉取最新代码
          git pull --rebase origin main
          git push
