name: ETF Recommendation (Daily)

on:
  # 收盘后运行：北京时间 15:35
  schedule:
    - cron: '35 7 * * 1-5'  # 周一到周五 07:35 UTC (15:35 北京时间)
  
  # 手动触发
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install akshare pandas tenacity requests
      
      - name: Run crawler
        env:
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
        run: |
          python scripts/crawl_data.py
      
      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/latest.json data/etf_history.json
          git diff --quiet --cached || git commit -m "📊 Auto update: $(date +'%Y-%m-%d %H:%M') UTC"
          
          # 推送前先拉取最新代码
          git pull --rebase origin main
          git push
